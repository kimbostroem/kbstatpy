# The repository had no CI before this. Its job is to make the claim in README.md
# ("native Windows is supported") verifiable rather than asserted: the maintainer
# works on macOS, so nothing else exercises install.ps1 or the rpy2 bridge on
# Windows.
#
# There is deliberately no "fast, R-free tests" job. Every test imports kbstatpy,
# whose __init__ imports kbstat, which calls ro.r('emmeans::emm_options(...)') at
# module level -- so even test_citation_metadata.py needs R with emmeans present.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Genuinely dependency-free, so it fails fast and separately from anything
  # needing R. Lints install.ps1 against the engine it actually targets: Windows
  # PowerShell 5.1 is not the engine on any runner here, so a plain parse would
  # miss the 7.x-only syntax (??, ternary, && chains) that 5.1 rejects. The
  # compatibility rules check against a real 5.1 platform profile instead.
  lint-installers:
    name: Lint the installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.sh syntax
        run: bash -n install.sh

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: install.ps1 parse check
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                  Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              exit 1
          }
          Write-Host "parse OK - $($tokens.Count) tokens"

      - name: install.ps1 vs Windows PowerShell 5.1
        shell: pwsh
        run: |
          $win51 = 'win-48_x64_10.0.17763.0_5.1.17763.316_x64_4.0.30319.42000_framework'
          # PSAvoidUsingWriteHost is excluded deliberately: an installer's whole
          # job is talking to a human, and Write-Output would put the banner text
          # into the pipeline, where install.sh uses plain echo.
          $settings = @{
              IncludeRules = @('PSUseCompatibleSyntax', 'PSUseCompatibleCommands', 'PSUseCompatibleTypes')
              Rules = @{
                  PSUseCompatibleSyntax   = @{ Enable = $true; TargetVersions = @('5.1') }
                  PSUseCompatibleCommands = @{ Enable = $true; TargetProfiles = @($win51) }
                  PSUseCompatibleTypes    = @{ Enable = $true; TargetProfiles = @($win51) }
              }
          }
          $found = Invoke-ScriptAnalyzer -Path ./install.ps1 -Settings $settings
          if ($found) {
              $found | ForEach-Object {
                  Write-Host "::error file=install.ps1,line=$($_.Line)::[$($_.RuleName)] $($_.Message)"
              }
              exit 1
          }
          Write-Host 'no 5.1 incompatibilities'

  # The job the whole exercise is for. Runs the real installer on a clean machine
  # and then the real analyses, because the characteristic native-Windows failure
  # (rpy2 not finding R.dll) passes every static check and only shows up at
  # import time.
  install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # Set here rather than left to R's default so the cache path below is known
      # before setup-r runs, and so both installers agree on where packages go.
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    strategy:
      # One platform's failure should not hide another's.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          # Both ends of requires-python, on the platform where a failure is
          # cheapest to diagnose.
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          # Serves the R packages as prebuilt binaries. Without it lme4 and
          # glmmTMB compile from source, which turns a one-minute step into ten.
          use-public-rspm: true

      - name: Create the R user library
        # R drops a non-existent directory from .libPaths(), so install.packages()
        # would silently fall back to the site library and the cache below would
        # cache nothing.
        shell: bash
        run: mkdir -p "$R_LIBS_USER"

      - name: Cache the R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          # Keyed on the installers, since that is where the package list lives.
          key: ${{ runner.os }}-R-${{ hashFiles('install.sh', 'install.ps1') }}
          restore-keys: ${{ runner.os }}-R-

      - name: Run the installer (Windows)
        if: runner.os == 'Windows'
        # Invoked exactly as README.md tells users to, and through `powershell`
        # rather than `pwsh` on purpose: 5.1 is what a default Windows box has,
        # and it is the engine install.ps1 is written for.
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File install.ps1

      - name: Run the installer (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash ./install.sh

      - name: Import check
        # Overlaps the installer's own verification step, and kept anyway: it
        # proves the package imports in a fresh process, not just inside the
        # installer's environment.
        run: python -c "import kbstatpy; print(kbstatpy.__version__)"

      - name: Test suite
        shell: bash
        run: |
          fail=0
          for f in tests/test_*.py; do
              echo "== $f"
              python "$f" || fail=1
          done
          exit $fail

      - name: Demos
        run: python run_demos.py

      - name: Upload the demo output
        # always(), so a figure that renders wrongly can be looked at rather than
        # guessed at from a log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: results/
          if-no-files-found: warn
